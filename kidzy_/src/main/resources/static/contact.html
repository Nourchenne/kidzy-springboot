<section class="contact-page-section">

        <div class="sec-title">
            <div class="title">Contactez-nous</div>

                                <div class="row clearfix">
                                    <div class="form-group col-md-6 col-sm-6 col-xs-12">

                                    </div>
                                    <div class="form-group col-md-12 col-sm-12 col-xs-12">

                            <li><a href="#"><i class="fab fa-instagram"></i></a></li>
                        </ul>

                </div>

            </div>
        </div>
    </div>
</section>


<!-- JavaScript pour simuler l’envoi du formulaire -->
<script>
    document.getElementById('contact-form').addEventListener('submit', function (e) {
        e.preventDefault();

        const name = this.name.value.trim();
        const email = this.email.value.trim();
        const message = this.message.value.trim();
        const messageBox = document.getElementById('form-message');

        if (name && email && message) {
            // Prépare les données en JSON à envoyer
            const data = {
                nom: name,
                email: email,
                message: message,
                // dateContact : tu peux laisser null ou ne pas l'envoyer et la gérer côté serveur
            };

            fetch('/api/contacts', { // adapte le port si besoin
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            })
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Erreur réseau ou serveur');
                    }
                    return response.json();
                })
                .then(data => {
                    messageBox.textContent = "Votre message a été envoyé avec succès.";
                    messageBox.className = "message success";
                    // Reset form après succès
                    this.reset();
                })
                .catch(error => {
                    console.error('Erreur:', error);
                    messageBox.textContent = "Une erreur est survenue lors de l'envoi.";
                    messageBox.className = "message error";
                });
        } else {
            messageBox.textContent = "Tous les champs doivent être remplis.";
            messageBox.className = "message error";
        }
    });
</script>
