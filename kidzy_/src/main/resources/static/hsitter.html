<h3>Demandes de Garde d’Enfants</h3>

<div id="requests-container" class="requests"></div>


<script>
  fetch('/api/requests')
          .then(response => response.json())
          .then(requests => {
            const container = document.getElementById('requests-container');
            requests.forEach(request => {
              const div = document.createElement('div');
              div.classList.add('request');
              div.innerHTML = `
          <h4>${request.nom}</h4>
          <p><strong>Email :</strong> ${request.email}</p>
          <p><strong>Localisation :</strong> ${request.localisation}</p>
          <p><strong>Nombre d’enfants :</strong> ${request.nombreEnfants}</p>
          <p><strong>Message :</strong> ${request.message}</p>
          <p><strong>Posté le :</strong> ${request.createdAt}</p>
          <a href="https://mail.google.com/mail/?view=cm&fs=1&to=${encodeURIComponent(request.email)}&su=Réponse%20à%20votre%20demande%20de%20babysitting&body=Bonjour%20${encodeURIComponent(request.nom)},%0D%0AJe%20vous%20contacte%20concernant%20votre%20demande%20de%20garde%20d’enfants." class="contact-btn" target="_blank">Contacter</a>
        `;
              container.appendChild(div);
            });
          })
          .catch(error => {
            console.error('Erreur lors du chargement des demandes:', error);
          });
</script>
