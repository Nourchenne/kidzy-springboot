<script>
  document.getElementById('babysitterForm').addEventListener('submit', async function (e) {
    e.preventDefault(); // Empêche l'envoi traditionnel du formulaire

    const formData = new FormData(this);
    const data = Object.fromEntries(formData.entries());

    try {
      const response = await fetch('/api/babysitters', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(data)
      });

      const msgEl = document.getElementById("responseMsg");

      if (response.ok) {
        msgEl.innerText = "Inscription réussie ! 🎉";
        msgEl.style.color = "green";
        this.reset(); // Réinitialiser le formulaire
      } else {
        const errorText = await response.text();
        msgEl.innerText = "Erreur lors de l'inscription : " + errorText;
        msgEl.style.color = "red";
      }

    } catch (error) {
      document.getElementById("responseMsg").innerText = "Erreur réseau : " + error;
      document.getElementById("responseMsg").style.color = "red";
    }
  });
</script>
